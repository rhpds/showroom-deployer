name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/ct.yaml'
      - '.github/workflows/lint-charts.yaml'

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Helm lint
        run: |
          for chart in charts/*/; do
            echo "::group::Linting $chart"
            helm lint "$chart"
            echo "::endgroup::"
          done

      - name: Helm template (render check)
        run: |
          for chart in charts/*/; do
            echo "::group::Rendering $chart"
            helm template test-release "$chart" > /dev/null
            echo "::endgroup::"
          done

      - name: Run chart-testing lint
        run: ct lint --config .github/ct.yaml --target-branch ${{ github.event.pull_request.base.ref }}
