---
# Default values for showroom.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

guid: nnnnn
user: ""

deployer:
  domain: cluster-GUID.GUID.sandboxNUMBERS.opentlc.com

proxy:
  image: quay.io/rhpds/traefik:v3.7.9
  imagePullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 16Mi

content:
  image: quay.io/rhpds/showroom-content:v1.4.2
  imagePullPolicy: IfNotPresent
  repoUrl: https://github.com/rhpds/showroom-template.git
  repoRef: main
  antoraPlaybook: site.yml
  antoraUiBundleUrl: ""
  antoraNavbarLogo: ""
  enableDevMode: "false"
  uiConfig: ""
  zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  user_data: |
    bastion_password: from_helm

runtime_automation:
  setup: "false"
  image: quay.io/rhpds/zerotouch-automation:v1.3.1
  imagePullPolicy: Always
  port: 8501
  # Ansible credentials for playbooks that target remote hosts.
  # Optional; only needed when playbooks SSH to remote hosts.
  ansible_user: ""
  ansible_password: ""
  environment_variables: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

terminal:
  setup: "true"
  image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
  imagePullPolicy: IfNotPresent
  port: 7681
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # Set up persistent storage for the lab-user's home directory
  storage:
    setup: "true"
    pvcSize: 5Gi
    # Use default Storage Class when empty
    storageClass: ""
  # Full podman (pull/run, with real networking) inside the terminal
  # container, via OpenShift's Kubernetes-native pod-level user namespaces
  # (hostUsers: false) plus a narrowly-scoped custom SCC -- confirmed
  # working by live testing against OpenShift 4.20 (Sept 2026), see
  # showroom-images/ocp-terminal/README.adoc for the full writeup.
  #
  # Requires sccName to already exist on the cluster (cluster-scoped,
  # created once per cluster -- see rhpds/showroom's
  # ocp4_workload_showroom_terminal_podman_enable) and requires the
  # deploying credentials to have cluster-admin (dedicated/ephemeral
  # clusters only -- this SCC binding will fail on shared clusters where
  # that isn't the case). Leave disabled unless a specific lab needs it;
  # most labs are fine with skopeo copy under the default SCC.
  podman:
    enabled: "false"
    # Cloned from OpenShift's built-in nested-container SCC with SYS_ADMIN,
    # SYS_CHROOT, NET_ADMIN, NET_RAW added to allowedCapabilities -- not a
    # change to nested-container itself.
    sccName: showroom-terminal-podman

wetty:
  setup: "true"
  image: quay.io/rhpds/wetty:v3.2.1
  imagePullPolicy: IfNotPresent
  port: 8001
  base: "wetty"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 500m
      memory: 256Mi

git_cloner:
  image: quay.io/rhpds/git-cloner:v1.1.5

antora:
  image: quay.io/rhpds/antora:v1.3.0

novnc:
  setup: "false"
  image: ghcr.io/rhpds/showroom-novnc:latest
  imagePullPolicy: IfNotPresent
  port: 6080
  vncServer: 127.0.0.1:5900
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 500m
      memory: 256Mi
