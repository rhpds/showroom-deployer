---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-traefik-dynamic
  namespace: {{ .Release.Namespace }}
data:
  dynamic.yml: |
    http:
      routers:
        showroom:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - web
          service: showroom
{{- if eq .Values.authguard.setup "true" }}
          middlewares:
            - authguard
{{- end }}
          priority: 1
{{- if eq .Values.terminal.setup "true" }}
        terminal:
          rule: "PathPrefix(`/terminal`)"
          entryPoints:
            - web
          service: terminal
          middlewares:
{{- if eq .Values.authguard.setup "true" }}
            - authguard
{{- end }}
            - terminal-stripprefix
          priority: 10
{{- end }}
{{- if eq .Values.wetty.setup "true" }}
        wetty:
          rule: "PathPrefix(`/wetty`)"
          entryPoints:
            - web
          service: wetty
{{- if eq .Values.authguard.setup "true" }}
          middlewares:
            - authguard
{{- end }}
          priority: 10
{{- end }}
{{- if eq .Values.runtime_automation.setup "true" }}
        runner-stream:
          rule: "PathPrefix(`/stream`)"
          entryPoints:
            - web
          service: runner
{{- if eq .Values.authguard.setup "true" }}
          middlewares:
            - authguard
{{- end }}
          priority: 50
        runner-api:
          rule: "PathPrefix(`/runner`)"
          entryPoints:
            - web
          service: runner
          middlewares:
{{- if eq .Values.authguard.setup "true" }}
            - authguard
{{- end }}
            - runner-api-stripprefix
          priority: 50
{{- end }}
{{- if eq .Values.novnc.setup "true" }}
        novnc:
          rule: "PathPrefix(`/novnc`)"
          entryPoints:
            - web
          service: novnc
          middlewares:
{{- if eq .Values.authguard.setup "true" }}
            - authguard
{{- end }}
            - novnc-stripprefix
          priority: 10
        websockify:
          rule: "PathPrefix(`/websockify`)"
          entryPoints:
            - web
          service: novnc
{{- if eq .Values.authguard.setup "true" }}
          middlewares:
            - authguard
{{- end }}
          priority: 10
{{- end }}
{{- if eq .Values.authguard.setup "true" }}
        authguard-login:
          rule: "PathPrefix(`/login`)"
          entryPoints:
            - web
          service: authguard
          priority: 100
{{- end }}

      services:
        showroom:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8000"
{{- if eq .Values.terminal.setup "true" }}
        terminal:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:{{ .Values.terminal.port }}"
{{- end }}
{{- if eq .Values.wetty.setup "true" }}
        wetty:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:{{ .Values.wetty.port }}"
{{- end }}
{{- if eq .Values.runtime_automation.setup "true" }}
        runner:
          loadBalancer:
            responseForwarding:
              flushInterval: "-1s"
            servers:
              - url: "http://127.0.0.1:{{ .Values.runtime_automation.port }}"
{{- end }}
{{- if eq .Values.novnc.setup "true" }}
        novnc:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:{{ .Values.novnc.port }}"
{{- end }}
{{- if eq .Values.authguard.setup "true" }}
        authguard:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:{{ .Values.authguard.port }}"
{{- end }}

{{- if or (eq .Values.terminal.setup "true") (eq .Values.runtime_automation.setup "true") (eq .Values.novnc.setup "true") (eq .Values.authguard.setup "true") }}
      middlewares:
{{- if eq .Values.authguard.setup "true" }}
        authguard:
          forwardAuth:
            address: "http://127.0.0.1:{{ .Values.authguard.port }}/verify"
            trustForwardHeader: true
            preserveLocationHeader: true
            addAuthCookiesToResponse:
              - nookbag_auth
{{- end }}
{{- if eq .Values.terminal.setup "true" }}
        terminal-stripprefix:
          stripPrefix:
            prefixes:
              - "/terminal"
{{- end }}
{{- if eq .Values.runtime_automation.setup "true" }}
        runner-api-stripprefix:
          stripPrefix:
            prefixes:
              - "/runner"
{{- end }}
{{- if eq .Values.novnc.setup "true" }}
        novnc-stripprefix:
          stripPrefix:
            prefixes:
              - "/novnc"
{{- end }}
{{- end }}
