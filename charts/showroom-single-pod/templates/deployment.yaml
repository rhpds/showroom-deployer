---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/traefik-static: {{ include (print $.Template.BasePath "/proxy/configmap-traefik-static.yaml") . | sha256sum }}
        checksum/traefik-dynamic: {{ include (print $.Template.BasePath "/proxy/configmap-traefik-dynamic.yaml") . | sha256sum }}
        checksum/userdata: {{ include (print $.Template.BasePath "/proxy/configmap-user-data.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      initContainers:
      - name: git-cloner
        image: {{ .Values.git_cloner.image | quote }}
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.content.repoUrl | quote }}
        - name: GIT_REPO_REF
          value: {{ .Values.content.repoRef | quote }}
        - name: CLONE_DIR
          value: "/showroom/repo"
        volumeMounts:
        - mountPath: /showroom/repo
          name: {{ .Release.Name }}-files
          subPath: repo
      - name: antora-builder
        image: {{ .Values.antora.image | quote }}
        env:
        - name: FILES_DIR
          value: "/showroom/repo"
        - name: OUTPUT_DIR
          value: "/showroom/www"
        - name: ANTORA_SITE_FILE
          value: {{ .Values.content.antoraPlaybook | quote }}
        - name: ANTORA_ENABLE_DEV_MODE
          value: {{ .Values.content.enableDevMode | quote }}
{{- if .Values.content.antoraUiBundleUrl }}
        - name: ANTORA_UI_BUNDLE_URL
          value: {{ .Values.content.antoraUiBundleUrl | quote }}
{{- end }}
{{- if .Values.content.antoraNavbarLogo }}
        - name: ANTORA_KEY_NAVBAR_LOGO
          value: {{ .Values.content.antoraNavbarLogo | quote }}
{{- end }}
        volumeMounts:
        - mountPath: /showroom/repo
          name: {{ .Release.Name }}-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/www
          name: {{ .Release.Name }}-files
          subPath: www
      containers:
      - name: traefik
        image: {{ .Values.proxy.image | quote }}
        imagePullPolicy: {{ .Values.proxy.imagePullPolicy | quote }}
        args:
        - "--configFile=/etc/traefik/traefik.yml"
        volumeMounts:
        - mountPath: /etc/traefik/traefik.yml
          name: traefik-static
          subPath: traefik.yml
          readOnly: true
        - mountPath: /etc/traefik/dynamic.yml
          name: traefik-dynamic
          subPath: dynamic.yml
          readOnly: true
        ports:
        - name: web
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          {{- toYaml .Values.proxy.resources | nindent 10 }}

      - name: content
        image: {{ .Values.content.image | quote }}
        imagePullPolicy: {{ .Values.content.imagePullPolicy | quote }}
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.content.repoUrl | quote  }}
        - name: GIT_REPO_REF
          value: {{ .Values.content.repoRef | quote  }}
        - name: ANTORA_PLAYBOOK
          value: {{ .Values.content.antoraPlaybook | quote  }}
        - name: ZT_BUNDLE
          value: {{ .Values.content.zero_touch_bundle | quote  }}
        - name: ZT_UI_ENABLED
          value: "true"
        - name: SHOWROOM_UI_CONFIG
          value: {{ .Values.content.uiConfig | quote }}
        - name: DOMAIN
          value: {{ .Values.deployer.domain | quote }}
        - name: GUID
          value: {{ .Values.guid | quote }}
        - name: USER
          value: {{ .Values.user | quote }}
        volumeMounts:
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/repo
          name: {{ .Release.Name }}-files
          subPath: repo
        - mountPath: /showroom/www
          name: {{ .Release.Name }}-files
          subPath: www
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          {{- toYaml .Values.content.resources | nindent 10 }}

{{- if eq .Values.runtime_automation.setup "true" }}
      - name: runner
        image: {{ .Values.runtime_automation.image | quote }}
        imagePullPolicy: {{ .Values.runtime_automation.imagePullPolicy | quote }}
        env:
        - name: PORT
          value: {{ .Values.runtime_automation.port | quote }}
        - name: GUID
          value: {{ .Values.guid | quote }}
        - name: DOMAIN
          value: {{ .Values.deployer.domain | quote }}
        - name: ANSIBLE_USER
          value: {{ .Values.runtime_automation.ansible_user | quote }}
        - name: ANSIBLE_PASSWORD
          value: {{ .Values.runtime_automation.ansible_password | quote }}
{{- range $key, $value := .Values.runtime_automation.environment_variables }}
        - name: {{ $key | upper }}
          value: {{ $value | quote }}
{{- end }}
        ports:
        - name: runner
          containerPort: {{ .Values.runtime_automation.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: runner
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: runner
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /app/runtime-automation
          name: {{ .Release.Name }}-files
          subPath: repo/runtime-automation
        - mountPath: /showroom/repo
          name: {{ .Release.Name }}-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        resources:
          {{- toYaml .Values.runtime_automation.resources | nindent 10 }}
{{- end }}

{{- if eq .Values.terminal.setup "true" }}
      - name: terminal
        image: {{ .Values.terminal.image | quote }}
        imagePullPolicy: {{ .Values.terminal.imagePullPolicy | quote }}
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: {{ .Values.guid | quote }}
        volumeMounts:
        - name: terminal-lab-user-home
          mountPath: /home/lab-user
        - name: terminal-data-ssh # to enable ssh out of the container
          mountPath: /data/.ssh
        ports:
        - containerPort: {{ .Values.terminal.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.terminal.resources | nindent 10 }}
{{- end }}

{{- if eq .Values.wetty.setup "true" }}
      - name: wetty
        image: {{ .Values.wetty.image | quote }}
        imagePullPolicy: {{ .Values.wetty.imagePullPolicy | quote }}
        args:
        - --base="/{{ .Values.wetty.base }}/"
        - --port={{ .Values.wetty.port }}
        - --allow-iframe=true
{{-   if and .Values.wetty.ssh (eq .Values.wetty.ssh.autoSshToBastion "true") }}
        - --ssh-host={{ .Values.wetty.ssh.sshHost }}
        - --ssh-port={{ .Values.wetty.ssh.sshPort }}
        - --ssh-user={{ .Values.wetty.ssh.sshUser }}
        - --ssh-auth={{ .Values.wetty.ssh.sshAuth }}
        - --ssh-pass={{ .Values.wetty.ssh.sshPass }}
{{-   end }}
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GUID
          value: {{ .Values.guid | quote }}
        ports:
        - containerPort: {{ .Values.wetty.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.wetty.resources | nindent 10 }}
{{- end }}

{{- if eq .Values.novnc.setup "true" }}
      - name: novnc
        image: {{ .Values.novnc.image | quote }}
        imagePullPolicy: {{ .Values.novnc.imagePullPolicy | quote }}
        args:
        - websockify
        - --web=/www
        - 127.0.0.1:{{ .Values.novnc.port }}
        - "{{ .Values.novnc.vncServer }}"
        ports:
        - containerPort: {{ .Values.novnc.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.novnc.resources | nindent 10 }}
{{- end }}

      volumes:
      - name: {{ .Release.Name }}-files
        emptyDir: {}
      - name: user-data
        configMap:
          name: {{ .Release.Name }}-userdata
      - name: traefik-static
        configMap:
          name: {{ .Release.Name }}-traefik-static
      - name: traefik-dynamic
        configMap:
          name: {{ .Release.Name }}-traefik-dynamic
{{- if eq .Values.terminal.setup "true" }}
      - name: terminal-data-ssh # to enable ssh out of the container
        emptyDir: {}
      - name: terminal-lab-user-home
{{-   if eq .Values.terminal.storage.setup "true" }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-terminal-lab-user-home
{{-   else }}
        emptyDir: {}
{{-   end }}
{{- end }}
